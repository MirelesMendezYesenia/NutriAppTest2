{% extends "base.html" %}

{% block contenido %}
<div class="d-flex flex-column align-items-center py-4" style="background-color: #d8b5f7ff;">
    <div class="p-4 rounded shadow-sm" style="max-width: 400px; width: 100%; background-color: #8ba9e7ff">
        <h2 class="mb-3 text-center text-dark"><i>CALCULADORA DE MACRONUTRIENTES</i></h2>
        
        <form action="/calculadoraMACRO" method="POST">
    <div class="mb-3">
        <input type="number" class="form-control" name="calorias" required placeholder="Calorías diarias (kcal)">
    </div>

    <button type="submit" class="btn btn-dark w-100">Calcular Macros</button>
</form>

{% if proteinas %}
<div class="alert alert-info mt-3 text-center">
    Proteínas: <strong>{{ proteinas }} g</strong><br>
    Grasas: <strong>{{ grasas }} g</strong><br>
    Carbohidratos: <strong>{{ carbohidratos }} g</strong>
</div>
{% endif %}


    </div>
    </div>
{% endblock %}
