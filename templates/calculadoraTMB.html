{% extends "base.html" %}

{% block contenido %}
<div class="d-flex flex-column align-items-center py-4" style="background-color: #d8b5f7ff;">
    <div class="p-4 rounded shadow-sm" style="max-width: 400px; width: 100%; background-color: #8ba9e7ff">
        <h2 class="mb-3 text-center text-dark"><i>CALCULADORA DE TASA METABÓLIOCA BASAL</i></h2>
        
        <form action="/calculadoraTMB" method="POST">
            <div class="mb-3">
            <input type="number" class="form-control" name="peso" required placeholder="peso">
        </div>

        <div class="md-3">
            <input type="number" class="form-control" name="estatura" placeholder="estatura" required>
        </div>
        <div class="mb-3">
            <input type="number" class="form-control" name="edad" required placeholder="Edad">
        </div>
        <div class="mb-3">
                <select name="genero" id="genero" class="form-select" required>
                    <option value="female">Msculino</option>
                    <option value="male">Femenino</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-dark w-100">Calcular TMB</button>
        </form>

        {% if resultado %}
<div class="alert alert-success mt-3 text-center">
    Tu Tasa Metabólica Basal es: <strong>{{ resultado | round(2) }} kcal/día</strong>
</div>
{% endif %}
        {% if error %}
            <div class="alert alert-danger mt-3 text-center">
                {{ error }}
            </div>
        {% endif %}

    </div>
    </div>
{% endblock %}
